name: CI/CD

on:
  push:
    branches: ["develop"]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-20.04
    permissions:
      contents: read

    steps:
      - name: [Log] Start test job
        run: echo "===== TEST JOB START ====="

      - name: [Log] Checkout repository
        uses: actions/checkout@v4

      - name: [Log] Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: [Log] Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582

      - name: [Log] Grant execute permission to gradlew
        run: |
          echo "Giving execute permission to gradlew"
          chmod +x ./gradlew
          ls -l ./gradlew

      - name: [Log] Check Gradle version
        run: |
          echo "Checking Gradle version"
          ./gradlew --version

      - name: [Log] Run tests
        run: |
          echo "Running :container:test"
          ./gradlew :container:test --info --stacktrace --no-daemon
        env:
          TERM: dumb

      - name: [Log] End test job
        run: echo "===== TEST JOB END ====="

  build:
    needs: test
    runs-on: ubuntu-20.04
    permissions:
      contents: read

    steps:
      - name: [Log] Start build job
        run: echo "===== BUILD JOB START ====="

      - name: [Log] Checkout repository
        uses: actions/checkout@v4

      - name: [Log] Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: [Log] Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582

      - name: [Log] Grant execute permission to gradlew
        run: |
          echo "Giving execute permission to gradlew"
          chmod +x ./gradlew
          ls -l ./gradlew

      - name: [Log] Run build
        run: |
          echo "Running :container:build"
          ./gradlew :container:build --info --stacktrace --no-daemon